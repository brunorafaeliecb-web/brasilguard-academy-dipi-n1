:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#243345;background:#eef2f7}*{box-sizing:border-box}body{margin:0}header{background:#32455c;color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:10px}header strong{font-size:19px}header small{color:#d2b75c}.pill{background:#d2b75c;color:#243345;border-radius:40px;padding:7px 12px;font-size:12px;font-weight:700}.wrap{max-width:1250px;margin:auto;padding:22px;display:grid;grid-template-columns:255px 1fr;gap:20px}nav{background:#fff;border-radius:15px;padding:14px;position:sticky;top:15px;align-self:start;max-height:90vh;overflow:auto;box-shadow:0 3px 18px #213c5820}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:9px;color:#3d5164;cursor:pointer;font-size:13px}nav button.selected{background:#32455c;color:white}nav button:hover{outline:1px solid #d2b75c}main{min-width:0}.card{background:white;border-radius:16px;padding:24px;margin-bottom:17px;box-shadow:0 3px 17px #213c5815}h1{font-size:27px;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px}p{line-height:1.7}small,.muted{color:#607186}.muted{font-size:13px}.tag{display:inline-block;background:#f3eacb;color:#60501f;border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700}.lessons{display:grid;gap:12px}.lesson{border:1px solid #dce5ee;border-radius:13px;padding:19px}.example{padding:12px 15px;border-left:4px solid #d2b75c;background:#fffbeb;border-radius:5px}.task{padding:12px 15px;background:#ebf3fb;border-radius:8px}.options{display:flex;flex-direction:column;gap:10px;margin:10px 0}.options label{background:#f4f7fa;border:1px solid #e1e8f0;border-radius:9px;padding:10px;cursor:pointer}.options input{accent-color:#32455c}button.primary,button.secondary{padding:12px 17px;border-radius:10px;border:0;cursor:pointer;font-weight:700}button.primary{background:#32455c;color:white}button.secondary{background:#ebeff3;color:#32455c}button:disabled{opacity:.5;cursor:not-allowed}.feedback{font-weight:600;padding:12px;margin:10px 0;border-radius:8px;background:#f0f4fa}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{border-radius:12px;background:#f1f5f9;padding:15px}.stat b{display:block;font-size:25px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{border:1px solid #cbd6e1;padding:8px 12px;background:#fff;border-radius:8px;cursor:pointer}.tabs button.active{background:#32455c;color:white}.gridcells{display:grid;grid-template-columns:45px repeat(4,minmax(52px,1fr));max-width:590px}.gridcells div{border:1px solid #cdd8e4;min-height:43px;display:flex;align-items:center;justify-content:center;background:white}.gridcells .head{background:#e7edf4;font-weight:bold}.gridcells button{border:0;background:transparent;width:100%;height:100%;cursor:pointer}.gridcells button.target{background:#f4e4a7}.gridcells button.picked{background:#a7d4ba}.connect{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cable,.port{border:2px solid #d6e1ec;border-radius:10px;padding:13px;min-height:68px;cursor:pointer;background:white}.cable.active{border-color:#b99b3d;background:#fff8dd}.port:focus{outline:3px solid #d2b75c}.banner{background:#fffbeb;color:#776027;border:1px solid #f1de9f;border-radius:10px;padding:12px;margin:12px 0;font-size:13px}footer{text-align:center;padding:20px;color:#6e7884;font-size:12px}@media(max-width:760px){.wrap{display:block;padding:12px}nav{position:static;max-height:none;margin-bottom:13px;display:flex;overflow-x:auto}nav button{flex:0 0 145px}.card{padding:17px}.stats{grid-template-columns:1fr}.connect{grid-template-columns:1fr}header{padding:15px}h1{font-size:23px}}@media print{nav,.tabs,button{display:none!important}.wrap{display:block}.card{box-shadow:none}}
</style></head><body><header><div><strong>BRASILGUARD ACADEMY · DIPI</strong><br><small>N1 — Informática Básica | 10 módulos | 60h curriculares</small></div><span class="pill">PROTÓTIPO DIDÁTICO</span></header><div class="wrap"><nav id="nav"></nav><main id="app"></main></div><footer><a href="https://wa.me/5521990888213?text=Nossa%2C%20vim%20pelo%20seu%20curso.%20%C3%89%20n%C3%ADvel%20um%20e%20estou%20querendo%20saber%20mais%20informa%C3%A7%C3%B5es." target="_blank" style="color:#32455c;font-weight:700;text-decoration:none;">BRS</a></footer>
<script>const COURSE=[{"title": "Fundamentos da informática", "hours": 5, "lessons": [{"title": "O que é informática", "theory": "Informática é o tratamento de informações por meios digitais. Um computador recebe dados, processa-os, armazena-os e apresenta resultados.", "example": "Na compra de supermercado, os preços digitados são dados; o total calculado é informação útil.", "practice": "Descreva uma situação cotidiana em que dados se transformam em informação.", "question": "Qual é uma função de um computador?", "options": ["Receber, processar e apresentar dados", "Somente imprimir", "Somente acessar a internet"], "correct": 0}, {"title": "Dados, informações e processamento", "theory": "Dado é um registro isolado, como 25. Informação é o dado interpretado no contexto, como “25 alunos presentes”. Processamento é a transformação entre esses estados.", "example": "Números de notas individuais podem ser processados em uma média da turma.", "practice": "Transforme três dados isolados em uma frase informativa.", "question": "Qual alternativa é uma informação contextualizada?", "options": ["42", "42 estudantes inscritos", "Um teclado"], "correct": 1}, {"title": "Hardware e software", "theory": "Hardware corresponde às partes físicas: gabinete, monitor, mouse, memória. Software são programas e instruções: navegador, editor de texto, sistema operacional.", "example": "Você pode tocar o teclado (hardware), mas não tocar o programa de digitação (software).", "practice": "Classifique monitor, navegador, mouse e sistema operacional.", "question": "O navegador de internet é um exemplo de:", "options": ["Hardware", "Software", "Cabo de energia"], "correct": 1}, {"title": "Periféricos de entrada e saída", "theory": "Periféricos permitem a comunicação com o computador. Entrada: teclado, mouse e microfone. Saída: monitor, impressora e alto-falante. Entrada e saída: touchscreen e muitos dispositivos de armazenamento.", "example": "Uma tela sensível ao toque mostra imagens e recebe comandos pelos dedos.", "practice": "Identifique dois exemplos de entrada, dois de saída e um de entrada/saída.", "question": "Qual é um periférico de entrada e saída?", "options": ["Caixa de som simples", "Tela touchscreen", "Teclado comum"], "correct": 1}, {"title": "Componentes e uso responsável", "theory": "O computador tem unidade de processamento, memória, armazenamento, fontes de energia e dispositivos de comunicação. Cuidados básicos incluem ventilação e desligamento adequado.", "example": "Salvar o arquivo antes de desligar evita perda de trabalho.", "practice": "Observe um computador e aponte cinco componentes, sem abrir equipamentos energizados.", "question": "Qual é a atitude mais segura?", "options": ["Retirar cabos com força", "Obstruir a ventilação", "Salvar o trabalho e desligar pelo sistema"], "correct": 2}]}, {"title": "Hardware e conexões", "hours": 6, "lessons": [{"title": "Gabinete e componentes", "theory": "O gabinete protege componentes como placa-mãe, processador, memória RAM, armazenamento e fonte. Não é sinônimo de CPU: CPU é o processador.", "example": "Em um computador de mesa, o gabinete abriga vários elementos que trabalham juntos.", "practice": "Associe processador, memória RAM e SSD às suas funções.", "question": "Qual componente executa instruções?", "options": ["Processador", "Monitor", "Mouse"], "correct": 0}, {"title": "Memória e armazenamento", "theory": "RAM mantém temporariamente dados usados pelos programas; SSD ou HD guardam arquivos de modo persistente. Capacidade costuma aparecer em GB ou TB.", "example": "Fechar um programa libera memória RAM; o documento salvo permanece no SSD.", "practice": "Diferencie uma foto salva de um aplicativo aberto na memória.", "question": "Qual opção normalmente conserva arquivos após desligar?", "options": ["Memória RAM", "SSD", "Cache temporário"], "correct": 1}, {"title": "Portas e cabos", "theory": "USB conecta diversos periféricos. HDMI transmite vídeo e, em geral, áudio digital. RJ45/Ethernet fornece conexão de rede cabeada. Conector de energia alimenta a fonte externa ou interna do equipamento.", "example": "Um mouse pode usar USB; um monitor pode receber vídeo por HDMI.", "practice": "No laboratório de conexões, associe cada cabo à porta correspondente.", "question": "Qual cabo é comumente utilizado para vídeo digital?", "options": ["HDMI", "RJ45", "Cabo de energia"], "correct": 0}, {"title": "Cuidados e segurança física", "theory": "Não abra fontes de alimentação, não manipule placas energizadas e não force conectores. Para limpeza e movimentação, siga as orientações do fabricante e desconecte a alimentação quando apropriado.", "example": "Um plugue com formato diferente não deve ser forçado na porta.", "practice": "Explique o que fazer se um cabo não encaixar facilmente.", "question": "Qual ação é correta?", "options": ["Forçar o conector", "Conferir tipo e orientação do encaixe", "Abrir fonte conectada"], "correct": 1}]}, {"title": "Sistemas operacionais", "hours": 7, "lessons": [{"title": "Para que serve um sistema operacional", "theory": "O sistema operacional coordena hardware, arquivos, programas e interação com a pessoa usuária. Exemplos: Windows, Linux, macOS e Android.", "example": "Sem o sistema operacional configurado, o uso cotidiano de programas fica limitado.", "practice": "Identifique o sistema operacional de um computador ou celular.", "question": "Qual opção é um sistema operacional?", "options": ["Windows", "Teclado", "HDMI"], "correct": 0}, {"title": "Área de trabalho e janelas", "theory": "Ícones representam atalhos ou itens. A barra de tarefas facilita alternar entre programas. Janelas podem ser movidas, redimensionadas, minimizadas e fechadas.", "example": "Minimizar um programa não significa encerrá-lo.", "practice": "Abra duas janelas e alterne entre elas sem fechar nenhuma.", "question": "O que acontece ao minimizar uma janela?", "options": ["Programa é sempre apagado", "Janela sai da vista, mas geralmente continua aberta", "Computador desliga"], "correct": 1}, {"title": "Configurações básicas", "theory": "Brilho, volume, idioma, data, acessibilidade e rede são configurações comuns. Algumas mudanças exigem permissão de administrador.", "example": "Diminuir o brilho pode facilitar leitura em determinados ambientes.", "practice": "Encontre as configurações de volume e acessibilidade sem alterar opções críticas.", "question": "Qual ajuste pode melhorar a leitura na tela?", "options": ["Tamanho do texto", "Desconectar o SSD", "Retirar memória RAM"], "correct": 0}, {"title": "Instalação e atualização", "theory": "Aplicativos devem ser obtidos de fontes confiáveis. Atualizações corrigem falhas e oferecem melhorias. Antes de instalar, confira origem, permissões e espaço.", "example": "Um programa oferecido por link desconhecido pode ser arriscado.", "practice": "Localize o menu de atualização e descreva por que ele é importante.", "question": "Qual fonte é preferível para instalar programas?", "options": ["Site oficial ou loja confiável", "Anexo inesperado", "Pop-up aleatório"], "correct": 0}]}, {"title": "Teclado, mouse e digitação", "hours": 5, "lessons": [{"title": "Conhecendo o teclado", "theory": "As teclas alfanuméricas inserem caracteres; Enter confirma ou cria linha, Backspace apaga à esquerda, Shift permite maiúsculas temporárias. O layout pode variar.", "example": "Shift + letra produz uma letra maiúscula.", "practice": "Digite uma frase com letras maiúsculas, acentos e pontuação.", "question": "Qual tecla normalmente apaga à esquerda do cursor?", "options": ["Enter", "Backspace", "Shift"], "correct": 1}, {"title": "Mouse e seleção", "theory": "Clique seleciona, duplo clique pode abrir e clique direito mostra opções contextuais. A roda rola o conteúdo. Em touchpads, gestos desempenham funções semelhantes.", "example": "Arrastar permite mover objetos em várias interfaces.", "practice": "Faça um clique, clique duplo, arraste e clique direito em atividade segura.", "question": "Qual ação normalmente abre opções contextuais?", "options": ["Clique direito", "Mover o mouse", "Desligar o monitor"], "correct": 0}, {"title": "Atalhos e edição", "theory": "Ctrl+C copia, Ctrl+V cola, Ctrl+X recorta e Ctrl+Z desfaz em muitos aplicativos. Os atalhos podem variar em outros sistemas.", "example": "Copiar não remove o item original; recortar normalmente prepara a movimentação.", "practice": "Digite duas linhas e use copiar, colar e desfazer.", "question": "Qual atalho costuma colar um texto?", "options": ["Ctrl+Z", "Ctrl+V", "Ctrl+C"], "correct": 1}, {"title": "Digitação confortável", "theory": "Posição confortável, pausas e ajuste de altura ajudam a reduzir esforço. Precisão vem antes de velocidade; pratique pequenas sequências de texto.", "example": "Manter ombros relaxados costuma ser melhor que digitar tensionado.", "practice": "Digite um texto de 80 palavras e revise os erros.", "question": "O que priorizar no início da digitação?", "options": ["Velocidade máxima", "Precisão e conforto", "Pressionar teclas com força"], "correct": 1}]}, {"title": "Arquivos e armazenamento", "hours": 6, "lessons": [{"title": "O que são arquivos e pastas", "theory": "Arquivo é uma unidade de conteúdo digital; pasta organiza arquivos e outras pastas. Nomes claros facilitam localizar documentos.", "example": "Uma pasta “Curso” pode conter subpastas “Textos” e “Exercícios”.", "practice": "Crie uma árvore de pastas para organizar um curso fictício.", "question": "Para que serve uma pasta?", "options": ["Organizar arquivos", "Aumentar a RAM", "Navegar na internet"], "correct": 0}, {"title": "Extensões de arquivos", "theory": "Extensões como .pdf, .jpg, .docx e .xlsx indicam formatos típicos. A extensão não garante que o conteúdo seja seguro ou genuíno.", "example": "Foto.jpg e trabalho.pdf são arquivos de tipos distintos.", "practice": "Classifique os exemplos por tipo: documento, imagem, planilha ou apresentação.", "question": "Qual extensão é comum em planilhas Excel?", "options": [".xlsx", ".mp3", ".jpg"], "correct": 0}, {"title": "Copiar, mover e excluir", "theory": "Copiar cria outra instância; mover altera a localização; excluir envia frequentemente à lixeira, mas nem sempre é recuperável. Confirme o destino antes de ações destrutivas.", "example": "Arrastar pode copiar ou mover dependendo do sistema e das teclas usadas.", "practice": "Crie, renomeie, copie e mova arquivos de treinamento.", "question": "Copiar um arquivo normalmente:", "options": ["Remove o original", "Cria uma segunda cópia", "Desliga o sistema"], "correct": 1}, {"title": "Backup e nuvem", "theory": "Backup é uma cópia de segurança para recuperação. Armazenamento em nuvem facilita acesso e sincronização, mas não substitui automaticamente uma estratégia de backup.", "example": "Excluir um arquivo sincronizado pode apagá-lo de vários dispositivos.", "practice": "Planeje cópia de segurança de um trabalho importante.", "question": "Qual é o objetivo do backup?", "options": ["Recuperar dados em caso de perda", "Acelerar teclado", "Aumentar monitor"], "correct": 0}]}, {"title": "Internet e navegação", "hours": 6, "lessons": [{"title": "Internet, rede e Wi-Fi", "theory": "Internet conecta redes globalmente. Wi-Fi é uma forma de conexão local sem fio; não significa, sozinho, acesso funcional à internet.", "example": "Um roteador pode fornecer Wi-Fi mesmo quando a conexão externa falha.", "practice": "Explique a diferença entre conectar ao Wi-Fi e acessar um site.", "question": "Wi-Fi é:", "options": ["Sinônimo de página web", "Tecnologia de rede sem fio", "Um editor de texto"], "correct": 1}, {"title": "Navegadores, sites e endereços", "theory": "Navegadores acessam páginas da web. Uma URL identifica recursos; links conectam conteúdos. Verifique o domínio antes de inserir informações.", "example": "Um endereço parecido com o de um banco pode ser falso.", "practice": "Abra duas abas e identifique domínio e caminho em uma URL fictícia.", "question": "O que é um navegador?", "options": ["Programa para acessar sites", "Cabo de rede", "Componente da RAM"], "correct": 0}, {"title": "Pesquisa e fontes", "theory": "Buscadores ajudam a localizar conteúdos, mas resultados não são automaticamente verdadeiros. Compare fontes, data, autoria e finalidade.", "example": "Uma notícia antiga não descreve necessariamente a situação atual.", "practice": "Pesquise um tema e compare duas fontes confiáveis.", "question": "Qual é uma boa prática de pesquisa?", "options": ["Confiar no primeiro resultado", "Conferir autoria e data", "Ignorar a origem"], "correct": 1}, {"title": "Downloads e formulários", "theory": "Baixar é receber arquivo; enviar é transferir dados ao serviço. Antes de anexar documentos ou preencher formulários, confira site e necessidade dos dados.", "example": "Um formulário pode solicitar somente nome e e-mail, não uma senha de banco.", "practice": "Faça uma simulação de preencher formulário sem dados pessoais reais.", "question": "Ao baixar um arquivo, devemos:", "options": ["Verificar a origem", "Abrir qualquer anexo", "Desativar toda segurança"], "correct": 0}]}, {"title": "E-mail e comunicação digital", "hours": 5, "lessons": [{"title": "Como funciona o e-mail", "theory": "E-mail é mensagem eletrônica enviada entre endereços. Assunto, destinatário, corpo e anexos são elementos básicos.", "example": "O campo assunto deve resumir a finalidade da mensagem.", "practice": "Monte um e-mail fictício com assunto e saudação adequados.", "question": "Qual campo resume o tema da mensagem?", "options": ["Assunto", "Anexo", "Lixeira"], "correct": 0}, {"title": "Responder, encaminhar e cópia", "theory": "Responder retorna mensagem ao remetente; responder a todos inclui outros participantes; encaminhar envia a terceiros. CC torna destinatários visíveis, CCO normalmente os oculta entre si.", "example": "Ao usar responder a todos, outras pessoas podem receber conteúdo desnecessário.", "practice": "Escolha o recurso apropriado em três cenários de comunicação.", "question": "Para não expor a lista de destinatários entre si, use:", "options": ["CCO", "Assunto", "Rascunho"], "correct": 0}, {"title": "Anexos e organização", "theory": "Anexos podem conter documentos e imagens. Verifique tamanho, formato e origem. Marcadores e pastas ajudam a classificar mensagens.", "example": "Antes de enviar currículo, confira se o arquivo correto foi anexado.", "practice": "Simule anexar documento e revisar destinatário antes do envio.", "question": "Antes de abrir anexo inesperado, é melhor:", "options": ["Verificar remetente e contexto", "Executar imediatamente", "Compartilhar senha"], "correct": 0}, {"title": "Videoconferência e etiqueta", "theory": "Chamadas online exigem atenção a câmera, microfone, ruído e privacidade. Comunicação clara e respeitosa evita mal-entendidos.", "example": "Silenciar microfone quando não está falando reduz interferências.", "practice": "Simule convite para reunião e revise boas práticas.", "question": "Qual atitude favorece uma videochamada?", "options": ["Falar com áudio duplicado", "Testar microfone antes", "Divulgar link publicamente"], "correct": 1}]}, {"title": "Editores de texto", "hours": 7, "lessons": [{"title": "Conhecendo o editor", "theory": "Editores como Word e LibreOffice Writer permitem escrever, editar e formatar documentos. Salvar frequentemente evita perda de trabalho.", "example": "Uma carta pode ser criada com título, corpo e assinatura.", "practice": "Crie um documento com título e dois parágrafos.", "question": "Qual programa é um editor de texto?", "options": ["LibreOffice Writer", "Excel", "Navegador"], "correct": 0}, {"title": "Fonte, parágrafo e alinhamento", "theory": "Fonte é o estilo tipográfico; tamanho ajusta legibilidade. Alinhamentos comuns são esquerda, centro, direita e justificado.", "example": "Títulos geralmente se destacam do corpo por tamanho e peso.", "practice": "Formate título, subtítulo e parágrafo no documento de treinamento.", "question": "Para centralizar o título, ajuste:", "options": ["Alinhamento do parágrafo", "Conexão HDMI", "Memória RAM"], "correct": 0}, {"title": "Listas, imagens e revisão", "theory": "Marcadores e numeração ajudam organizar sequências. Imagens podem complementar o texto; revisão ortográfica auxilia, mas não substitui leitura crítica.", "example": "Uma lista numerada é útil para passos em ordem.", "practice": "Insira lista de três itens e uma imagem autorizada no documento.", "question": "Quando uma lista numerada é mais útil?", "options": ["Em etapas sequenciais", "Para substituir qualquer texto", "Para conectar cabos"], "correct": 0}, {"title": "Salvar, exportar e imprimir", "theory": "Salvar mantém formato editável; exportar PDF facilita compartilhar aparência. Antes de imprimir, confira páginas, margens e impressora.", "example": "Um documento .docx pode ser exportado em .pdf.", "practice": "Salve documento editável e exporte versão PDF.", "question": "Qual formato costuma preservar layout de leitura?", "options": ["PDF", "TXT sem formatação", "Arquivo temporário"], "correct": 0}]}, {"title": "Planilhas e apresentações", "hours": 8, "lessons": [{"title": "Excel: linhas, colunas e células", "theory": "Uma planilha é uma grade. Colunas usam letras (A, B, C), linhas usam números (1, 2, 3). A interseção B3 é uma célula.", "example": "B3 significa coluna B e linha 3.", "practice": "No laboratório interativo, clique em C3 e preencha valores nas células indicadas.", "question": "Qual endereço identifica coluna C e linha 3?", "options": ["3C", "C3", "CC"], "correct": 1}, {"title": "Excel: dados e formatação", "theory": "Células podem conter texto, número e fórmulas. Formatação de moeda muda a exibição, não necessariamente o valor. Organização e cabeçalhos deixam tabelas claras.", "example": "Digite Produto, Quantidade e Preço nas três primeiras colunas.", "practice": "Monte tabela de compras com três produtos no laboratório.", "question": "O que identifica uma coluna?", "options": ["Letra", "Número", "Extensão"], "correct": 0}, {"title": "Excel: soma e fórmulas", "theory": "Fórmulas começam com =. A expressão =SOMA(B2:B4) soma o intervalo B2 até B4 em versões do Excel configuradas em português; funções e separadores variam conforme idioma.", "example": "Se B2=5, B3=7 e B4=3, a soma é 15.", "practice": "Preencha B2, B3 e B4 e insira =SOMA(B2:B4) em B5.", "question": "Qual fórmula soma B2 até B4?", "options": ["SOMA B2-B4", "=SOMA(B2:B4)", "B2 B4"], "correct": 1}, {"title": "Excel: uso no cotidiano", "theory": "Planilhas organizam gastos, listas e controles. O objetivo do básico é ler, editar, organizar e calcular resultados simples com confiança.", "example": "Orçamento doméstico simples ajuda a visualizar despesas.", "practice": "Construa uma lista com três gastos e valor total.", "question": "Qual tarefa combina com planilha?", "options": ["Organizar despesas", "Trocar memória RAM", "Criar conexão Wi-Fi"], "correct": 0}, {"title": "PowerPoint: estrutura dos slides", "theory": "Apresentações são sequências de slides. Bons slides privilegiam legibilidade, informações essenciais e coerência visual.", "example": "Título, imagem relevante e poucas linhas podem ser suficientes.", "practice": "Organize uma apresentação com começo, meio e fim.", "question": "Qual é uma boa prática em slides?", "options": ["Texto excessivo", "Hierarquia visual clara", "Fonte ilegível"], "correct": 1}, {"title": "PowerPoint: criar e apresentar", "theory": "Insira títulos, imagens e elementos de apoio; escolha layouts consistentes; teste projeção e tempo de fala. Evite animações desnecessárias.", "example": "Três slides: quem sou, tema, conclusão.", "practice": "Elabore uma apresentação simples de três slides.", "question": "Antes de apresentar, convém:", "options": ["Testar o arquivo e a exibição", "Não revisar", "Usar todas as animações"], "correct": 0}]}, {"title": "Segurança digital e autonomia", "hours": 5, "lessons": [{"title": "Senhas e autenticação", "theory": "Senhas l const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){document.getElementById('nav').innerHTML=COURSE.map((m,i)=>`<button class="${i===moduleIndex?'selected':''}" onclick="openModule(${i})">${i+1}. ${esc(m.title)} <small>· ${m.hours}h</small></button>`).join('')}
function openModule(i){moduleIndex=i;tab='aulas';answers={};render();scrollTo(0,0)}function setTab(t){tab=t;render()}
function render(){nav();const m=COURSE[moduleIndex];document.getElementById('app').innerHTML=`<section class="card"><span class="tag">MÓDULO ${moduleIndex+1} · ${m.hours} HORAS CURRICULARES</span><h1>${esc(m.title)}</h1><p class="muted">${m.lessons.length} capítulos • 30% teoria / 70% prática na metodologia • atividades com acompanhamento docente</p><div class="tabs"><button class="${tab==='aulas'?'active':''}" onclick="setTab('aulas')">Capítulos e práticas</button><button class="${tab==='lab'?'active':''}" onclick="setTab('lab')">Laboratório</button><button class="${tab==='review'?'active':''}" onclick="setTab('review')">Revisão</button></div></section>`+(tab==='aulas'?lessons(m):tab==='lab'?labs(m):review(m))}
function lessons(m){return `<section class="card"><h2>Aprender e praticar</h2><p class="muted">Após cada explicação, realize a atividade no equipamento ou na simulação. As perguntas aqui são formativas e dão feedback imediato.</p><div class="lessons">${m.lessons.map((l,i)=>`<article class="lesson"><span class="tag">CAPÍTULO ${i+1}</span><h3>${esc(l.title)}</h3><p>${esc(l.theory)}</p><div class="example"><strong>Exemplo:</strong> ${esc(l.example)}</div><p class="task"><strong>Atividade prática:</strong> ${esc(l.practice)}</p><p><b>Verifique o que aprendeu:</b> ${esc(l.question)}</p><div class="options">${l.options.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" onchange="answers[${i}]=${j}"> ${esc(o)}</label>`).join('')}</div><button class="secondary" onclick="check(${i})">Verificar aprendizado</button><div class="feedback" id="f${i}" hidden></div></article>`).join('')}</div></section>`}
function check(i){const l=COURSE[moduleIndex].lessons[i],el=document.getElementById('f'+i);el.hidden=false;el.textContent=answers[i]===undefined?'Selecione uma resposta.':answers[i]===l.correct?'Correto! Agora aplique o conhecimento na atividade prática.':'Ainda não. Releia a explicação e tente novamente.'}
let questionOrder=[];function makeReview(){const m=COURSE[moduleIndex];questionOrder=m.lessons.map((_,i)=>i).sort(()=>Math.random()-.5);answers={};render()}
function review(m){if(!questionOrder.length||questionOrder.some(i=>i>=m.lessons.length))questionOrder=m.lessons.map((_,i)=>i).sort(()=>Math.random()-.5);return `<section class="card"><h2>Revisão do módulo</h2><div class="banner">Revisão formativa local: não registra nota oficial, não calcula penalização BGD e não substitui uma avaliação segura no servidor. O gabarito desta demonstração faz parte do material local.</div>${questionOrder.map((ix,n)=>{const l=m.lessons[ix];return `<div class="lesson"><b>${n+1}. ${esc(l.question)}</b><div class="options">${l.options.map((o,j)=>`<label><input name="r${ix}" type="radio" onchange="answers[${ix}]=${j}"> ${esc(o)}</label>`).join('')}</div></div>`}).join('')}<p><button class="primary" onclick="finishReview()">Finalizar revisão</button> <button class="secondary" onclick="makeReview()">Nova sequência</button></p><div id="result"></div></section>`}
function finishReview(){const m=COURSE[moduleIndex],done=questionOrder.filter(i=>answers[i]!==undefined).length,correct=questionOrder.filter(i=>answers[i]===m.lessons[i].correct).length;document.getElementById('result').innerHTML=`<div class="feedback">Respondidas: ${done}/${questionOrder.length}. Acertos: ${correct}/${questionOrder.length}. Revise os capítulos e tente novamente. Resultado apenas desta sessão de demonstração.</div>`}
function labs(m){if(moduleIndex===8)return excelLab();if(moduleIndex===1)return connectionLab();return `<section class="card"><h2>Laboratório: ${esc(m.title)}</h2><p>Roteiro prático supervisionado. Execute as tarefas e documente evidências em arquivos de treinamento.</p>${m.lessons.map((l,i)=>`<div class="task"><label><input type="checkbox"> <b>Atividade ${i+1}:</b> ${esc(l.practice)}</label></div><br>`).join('')}<div class="banner">O checklist é local e não gera aprovação automática. O professor validará a execução na versão acadêmica.</div></section>`}
function connectionLab(){const names=['USB-A','HDMI','RJ45 / Ethernet','Energia AC (fonte)'];return `<section class="card"><h2>Laboratório de conexões</h2><p>Selecione um cabo e depois o encaixe correspondente. A atividade é conceitual: os desenhos das portas serão acrescentados na produção visual final.</p><div class="connect"><div><h3>Cabos</h3>${names.map((s,i)=>`<button class="cable ${selectedCable===i?'active':''}" onclick="selectedCable=${i};render()">🔌 ${s}</button>`).join('')}</div><div><h3>Portas do equipamento</h3>${[2,0,3,1].map(i=>`<button class="port" onclick="matchCable(${i})">${names[i]}</button>`).join('')}</div></div><p id="labmsg" class="feedback">Selecione primeiro um cabo.</p><div class="banner">Segurança: não faça conexões internas ou manuseio de alimentação elétrica em equipamentos energizados.</div></section>`}function matchCable(i){const e=document.getElementById('labmsg');e.textContent=selectedCable===null?'Primeiro escolha um cabo.':selectedCable===i?'Correspondência correta! Escolha outro cabo.':'Não corresponde. Compare os nomes e tente novamente.'}
let sheet={},cellTarget='C3';function excelLab(){let rows=5,cols=['A','B','C','D'];return `<section class="card"><h2>Laboratório de planilha interativa</h2><p>Etapa 1: encontre a célula <strong>${cellTarget}</strong>. Clique no endereço correto na grade.</p><div class="gridcells"><div class="head"></div>${cols.map(c=>`<div class="head">${c}</div>`).join('')}${Array.from({length:rows},(_,r)=>`<div class="head">${r+1}</div>${cols.map(c=>`<div><button class="${cellAnswer===c+(r+1)?'picked':''}" onclick="cellAnswer='${c+(r+1)}';document.getElementById('sheetmsg').textContent=cellAnswer==='${cellTarget}'?'Correto! Você encontrou a célula C3.':'Essa é '+cellAnswer+'. Tente C3.'">${esc(sheet[c+(r+1)]||'')}</button></div>`).join('')}`).join('')}</div><p id="sheetmsg" class="feedback">Selecione uma célula.</p><h3>Etapa 2: calcule uma soma</h3><p>Considere B2 = 5, B3 = 7 e B4 = 3. Digite a fórmula de soma de B2 até B4:</p><input id="formula" aria-label="Fórmula de soma" placeholder="=SOMA(...)" style="width:100%;max-width:340px;padding:12px;border:1px solid #cbd5e1;border-radius:8px"> <button class="primary" onclick="checkFormula()">Conferir fórmula</button><div id="formulaResult" class="feedback" hidden></div><h3>Etapa 3: pratique no Excel ou Calc</h3><p class="task">Crie uma planilha com os cabeçalhos Produto, Quantidade e Preço. Digite três produtos fictícios e calcule o total.</p><div class="banner">Este laboratório treina conceitos. Na versão definitiva serão incluídos preenchimento direto de células, movimentação de blocos, formatação e motor real de fórmulas.</div></section>`}
function checkFormula(){const val=document.getElementById('formula').value.trim().replace(/\s+/g,'').toUpperCase();const el=document.getElementById('formulaResult');el.hidden=false;el.textContent=val==='=SOMA(B2:B4)'?'Correto. A soma do intervalo é 15.':'Confira o sinal de igual, a função SOMA e o intervalo B2:B4.'}
render();</script></body></html>
